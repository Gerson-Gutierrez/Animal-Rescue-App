# Blueprint de Render: API (.NET, Docker) + frontend web (Expo, sitio estático).
# Render → New → Blueprint → elegir este repositorio.
#
# La base vive en una instancia PostgreSQL existente (Render permite una sola gratuita por workspace):
# en ConnectionStrings__Default se pega su "Internal Database URL" y Database__Nombre elige la base
# propia dentro de ella; la API la crea (con su esquema) al arrancar si no existe.
#
# Las URLs públicas salen del nombre del servicio (https://<name>.onrender.com). Si Render asigna otra
# (porque el nombre ya existe), corrige Cors__Origins__0 y EXPO_PUBLIC_API_URL y vuelve a desplegar.

services:
  - type: web
    name: animal-rescue-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__Default
        sync: false
      - key: Database__Nombre
        value: animal_rescue
      - key: Database__CrearEsquema
        value: "true"
      - key: Jwt__Secret
        generateValue: true
      - key: Cors__Origins__0
        value: https://animal-rescue-web-lt6n.onrender.com
      # Render termina TLS en su proxy: así la API ve las peticiones como HTTPS.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # Quien se registre con este correo será SUPERADMIN. Vacíalo después de crear la cuenta.
      - key: Bootstrap__SuperAdminEmail
        sync: false

  - type: web
    name: animal-rescue-web
    runtime: static
    repo: https://github.com/Gerson-Gutierrez/Animal.Rescue
    branch: master
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://animal-rescue-api-nfeb.onrender.com
      - key: NODE_VERSION
        value: "22"
